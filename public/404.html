<body>
    <!-- Hidden form for Netlify build bot detection -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="contact" />
        <p class="hidden"><label>Don't fill this out if you're human: <input name="bot-field" /></label></p>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="subject" />
        <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    
    <script>
        // GitHub Pages client-side routing fix
        (function() {
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;
            var basePath = '/jaydee-designs/';
            
            // If we're on GitHub Pages and not at the root, redirect to root with the path
            if (window.location.hostname === 'jaydeesquared.github.io' && path !== basePath && path !== '/') {
                // Redirect to the base path and let React Router handle the routing
                window.location.replace(basePath + '#' + path.replace(basePath, '/') + search + hash);
            }
        })();
    </script>
